<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numa Film Archive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='image/icon.png') }}">
</head>
<body>
    <div class="login-container">
        <img src="{{ url_for('static', filename='image/numa-film-logo.png') }}"
             alt="Numa Film" class="login-logo">
        <h1>NUMA FILM ARCHIVE</h1>
        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}
        <form method="post" class="login-form">
            <input type="text" name="username" placeholder="Username" autofocus required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
    </div>
</body>
</html>
