<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@100..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='image/icon.png') }}">
</head>
<body>
    <div class="video-player-container">
        <div class="video-wrapper">
            <video id="video-player" controls
                   data-start-url="{{ url_for('start_transcode', filename=video_path) }}"
                   data-status-url="{{ url_for('transcode_status', filename=video_path) }}"
                   data-proxy-url="{{ url_for('video_proxy', filename=video_path) }}"
                   data-original-url="{{ url_for('download_file', filename=video_path) }}">
                {% if not needs_transcode %}
                <source src="{{ url_for('serve_file', filename=video_path) }}" type="video/mp4">
                {% endif %}
                Your browser does not support the video tag.
                {% for endpoint, sub_path in subs %}
                <track src="{{ url_for(endpoint, filename=sub_path) }}" kind="subtitles" srclang="en" label="English" default>
                {% endfor %}
            </video>
            {% if needs_transcode %}
            <p id="transcode-status">Preparing video for playback&hellip;</p>
            {% endif %}
            <div class="video-controls">
                <button id="play-pause" title="Play/Pause">▶️</button>
                <button id="rewind" title="Rewind 10 Seconds">⏪</button>
                <button id="forward" title="Forward 10 Seconds">⏩</button>
                <button id="fullscreen" title="Fullscreen">⛶</button>
                <a href="{{ url_for('download_file', filename=video_path) }}" download title="Download original file">⬇</a>
            </div>
        </div>
        <a href="{{ url_for('index') }}" class="back-link">Back to Video List</a>
        <div class="related-videos-container">
            <h2>Related Videos</h2>
            <div id="related-videos" class="grid-view"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoPlayer = document.getElementById('video-player');
            if (videoPlayer) {
                const sourceEl = videoPlayer.querySelector('source');
                if (sourceEl) {
                    const currentVideoPath = sourceEl.src;
                    const folderPath = currentVideoPath.split('/').slice(0, -1).join('/');
                    fetchRelatedVideos(folderPath);
                }
            }

            const playPauseButton = document.getElementById('play-pause');
            const rewindButton = document.getElementById('rewind');
            const forwardButton = document.getElementById('forward');
            const fullscreenButton = document.getElementById('fullscreen');

            playPauseButton.addEventListener('click', function() {
                if (videoPlayer.paused) {
                    videoPlayer.play();
                    playPauseButton.textContent = '⏸️';
                } else {
                    videoPlayer.pause();
                    playPauseButton.textContent = '▶️';
                }
            });

            rewindButton.addEventListener('click', function() {
                videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
            });

            forwardButton.addEventListener('click', function() {
                videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 10);
            });

            fullscreenButton.addEventListener('click', function() {
                if (videoPlayer.requestFullscreen) {
                    videoPlayer.requestFullscreen();
                } else if (videoPlayer.mozRequestFullScreen) { /* Firefox */
                    videoPlayer.mozRequestFullScreen();
                } else if (videoPlayer.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                    videoPlayer.webkitRequestFullscreen();
                } else if (videoPlayer.msRequestFullscreen) { /* IE/Edge */
                    videoPlayer.msRequestFullscreen();
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            const currentVideoPath = "{{ video_path }}";
            const folderPath = currentVideoPath.substring(0, currentVideoPath.lastIndexOf('/'));
            fetchRelatedVideos(folderPath);
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoPlayer = document.getElementById('video-player');
            const statusEl = document.getElementById('transcode-status');
            if (!statusEl || !videoPlayer) return;

            function showError(message) {
                statusEl.textContent = message + ' ';
                const link = document.createElement('a');
                link.href = videoPlayer.dataset.originalUrl;
                link.textContent = 'Download the original file';
                link.setAttribute('download', '');
                statusEl.appendChild(link);
            }

            fetch(videoPlayer.dataset.startUrl, { method: 'POST' })
                .then(poll)
                .catch(() => showError('Could not start preparing this video.'));

            function poll() {
                fetch(videoPlayer.dataset.statusUrl)
                    .then((r) => r.json())
                    .then((data) => {
                        if (data.status === 'ready') {
                            statusEl.remove();
                            const source = document.createElement('source');
                            source.src = videoPlayer.dataset.proxyUrl;
                            source.type = 'video/mp4';
                            videoPlayer.appendChild(source);
                            videoPlayer.load();
                        } else if (data.status === 'error') {
                            showError('Could not prepare this video for playback.');
                        } else {
                            setTimeout(poll, 2000);
                        }
                    })
                    .catch(() => showError('Could not check transcode status.'));
            }
        });
    </script>
</body>
</html>
